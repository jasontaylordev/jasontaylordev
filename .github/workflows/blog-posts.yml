name: Latest blog posts

on:
  schedule:
    - cron: '0 20 * * *' # Every day at 20:00 UTC (06:00 Brisbane)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with latest posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull latest posts from the blog feed
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://jasontaylor.dev/rss/"
          max_post_count: 3
